name: Gitleaks Secret Scanning

on:
  push:
    branches:
      - main
      - secondaire
  pull_request:
    branches:
      - main

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks scan

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          source: .
          verbose: true
          config: .gitleaksconfig.toml
          fail: true
          redact: true
          report-format: sarif

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif.sarif
