name: CI — MANAWA Backend

on:
  push:
    branches: [main, develop, masterchef]
  pull_request:
    branches: [main, develop, masterchef]

permissions:
  contents: read
  security-events: write
  checks: write
  pull-requests: write

env:
  NODE_VERSION: '20.x'
  WORKING_DIR: backend

jobs:
  test:
    name: Tests & Coverage Gate (80%)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: manawa
          POSTGRES_PASSWORD: manawa_test
          POSTGRES_DB: manawa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Generate Prisma client
        working-directory: ${{ env.WORKING_DIR }}
        env:
          DATABASE_URL: postgresql://manawa:manawa_test@localhost:5432/manawa_test
          DIRECT_URL: postgresql://manawa:manawa_test@localhost:5432/manawa_test
        run: npx prisma generate

      - name: Push database schema
        working-directory: ${{ env.WORKING_DIR }}
        env:
          DATABASE_URL: postgresql://manawa:manawa_test@localhost:5432/manawa_test
          DIRECT_URL: postgresql://manawa:manawa_test@localhost:5432/manawa_test
        run: npx prisma db push --accept-data-loss

      - name: Run tests with coverage
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://manawa:manawa_test@localhost:5432/manawa_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'test-secret-min-32-characters-for-ci-only' }}
          MAILJET_API_KEY: test_mailjet_key_for_ci
          MAILJET_SECRET_KEY: test_mailjet_secret_for_ci
        run: npm test -- --forceExit

      - name: Enforce 80% coverage gate
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          node -e "
            const summary = require('./coverage/coverage-summary.json');
            const { lines, branches, functions, statements } = summary.total;
            const min = Math.min(lines.pct, branches.pct, functions.pct, statements.pct);
            console.log('Coverage — lines: ' + lines.pct + '%, branches: ' + branches.pct + '%, functions: ' + functions.pct + '%, statements: ' + statements.pct + '%');
            if (min < 80) { console.error('COVERAGE GATE FAILED: minimum is ' + min + '%, required 80%'); process.exit(1); }
          "

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/

  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF report
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          wait-for-processing: true

  deploy:
    name: Deploy to Production
    needs: [test, gitleaks]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger Render deployment
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sf \
            -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\":\"${COMMIT_SHA}\"}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")
          DEPLOY_ID=$(echo "${RESPONSE}" | jq -r '.id')
          echo "deploy_id=${DEPLOY_ID}" >> "${GITHUB_OUTPUT}"
          echo "Triggered deploy ${DEPLOY_ID} for commit ${COMMIT_SHA}"

      - name: Wait for deployment to complete
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=90
          ATTEMPT=0
          while [ "${ATTEMPT}" -lt "${MAX_ATTEMPTS}" ]; do
            RESPONSE=$(curl -sf \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}")
            STATUS=$(echo "${RESPONSE}" | jq -r '.status')
            DEPLOYED_SHA=$(echo "${RESPONSE}" | jq -r '.commit.id // ""')
            echo "Attempt $((ATTEMPT + 1))/${MAX_ATTEMPTS} - status: ${STATUS}"
            case "${STATUS}" in
              live)
                if [ "${DEPLOYED_SHA}" != "${EXPECTED_SHA}" ]; then
                  echo "SHA mismatch: expected ${EXPECTED_SHA}, deployed ${DEPLOYED_SHA}"
                  exit 1
                fi
                echo "Deploy ${DEPLOY_ID} is live (SHA: ${DEPLOYED_SHA})"
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Deploy failed with status: ${STATUS}"
                exit 1
                ;;
            esac
            ATTEMPT=$((ATTEMPT + 1))
            sleep 10
          done
          echo "Deploy timed out after $((MAX_ATTEMPTS * 10)) seconds"
          exit 1

      - name: Health check
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          SERVICE_URL=$(curl -sf \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" \
            | jq -r '.serviceDetails.url')
          echo "Health check: ${SERVICE_URL}/api/v1/health"
          curl -sf "${SERVICE_URL}/api/v1/health"
          echo "Health check passed"
