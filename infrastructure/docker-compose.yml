version: '3.9'

services:
  # Reverse proxy / Load balancer
  nginx:
    image: nginx:1.27-alpine
    container_name: manawa-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./geoip:/etc/nginx/geoip:ro
    environment:
      - TZ=UTC
    depends_on:
      - backend-1
      - backend-2
      - backend-3
      - backend-4
    networks:
      - manawa-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.manawa.service=lb"

  # Backend API Instance 1
  backend-1:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: manawa-backend-1
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - INSTANCE_ID=1
      - WORKERS=2
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - SENTRY_DSN=${SENTRY_DSN}
      - MAILJET_API_KEY=${MAILJET_API_KEY}
      - MAILJET_SECRET_KEY=${MAILJET_SECRET_KEY}
    volumes:
      - backend-logs-1:/app/logs
      - backend-uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - manawa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    labels:
      - "com.manawa.service=backend"
      - "com.manawa.instance=1"

  # Backend API Instance 2
  backend-2:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: manawa-backend-2
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4001
      - INSTANCE_ID=2
      - WORKERS=2
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - SENTRY_DSN=${SENTRY_DSN}
      - MAILJET_API_KEY=${MAILJET_API_KEY}
      - MAILJET_SECRET_KEY=${MAILJET_SECRET_KEY}
    volumes:
      - backend-logs-2:/app/logs
      - backend-uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - manawa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    labels:
      - "com.manawa.service=backend"
      - "com.manawa.instance=2"

  # Backend API Instance 3
  backend-3:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: manawa-backend-3
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4002
      - INSTANCE_ID=3
      - WORKERS=2
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - SENTRY_DSN=${SENTRY_DSN}
      - MAILJET_API_KEY=${MAILJET_API_KEY}
      - MAILJET_SECRET_KEY=${MAILJET_SECRET_KEY}
    volumes:
      - backend-logs-3:/app/logs
      - backend-uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - manawa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    labels:
      - "com.manawa.service=backend"
      - "com.manawa.instance=3"

  # Backend API Instance 4
  backend-4:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: manawa-backend-4
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4003
      - INSTANCE_ID=4
      - WORKERS=2
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - SENTRY_DSN=${SENTRY_DSN}
      - MAILJET_API_KEY=${MAILJET_API_KEY}
      - MAILJET_SECRET_KEY=${MAILJET_SECRET_KEY}
    volumes:
      - backend-logs-4:/app/logs
      - backend-uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - manawa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    labels:
      - "com.manawa.service=backend"
      - "com.manawa.instance=4"

  # Redis cache layer
  redis:
    image: redis:7.4-alpine
    container_name: manawa-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - manawa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    labels:
      - "com.manawa.service=cache"

  # PostgreSQL database
  postgres:
    image: postgres:17-alpine
    container_name: manawa-postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-manawa}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - manawa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    labels:
      - "com.manawa.service=database"

  # Monitoring & Metrics (optional - Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: manawa-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - manawa-network
    depends_on:
      - nginx
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"
    labels:
      - "com.manawa.service=monitoring"

  # Log aggregation (optional - Loki)
  loki:
    image: grafana/loki:latest
    container_name: manawa-loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - manawa-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"
    labels:
      - "com.manawa.service=logging"

networks:
  manawa-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  backend-logs-1:
  backend-logs-2:
  backend-logs-3:
  backend-logs-4:
  backend-uploads:
  prometheus-data:
  loki-data:
