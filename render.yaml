services:
  - type: web
    name: manawa-api
    runtime: node
    startCommand: cd backend && npm start
    buildCommand: cd backend && npm ci && bash scripts/migrate-deploy.sh
    plan: standard
    autoDeploy: false

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

    healthCheckPath: /api/v1/health
    healthCheckInterval: 30
    healthCheckTimeout: 10
    healthCheckFailureThreshold: 3

databases:
  - name: postgres
    plan: starter
    version: 15
    databaseName: manawa

  - name: redis
    plan: starter
    version: 7
